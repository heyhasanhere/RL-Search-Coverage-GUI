[project]
name = "sar-search"
version = "0.1.0"
description = "Multi-drone search coverage RL for search and rescue"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax>=0.7",
    "flax>=0.11",
    "optax>=0.2.5",
    "numpy>=2.0",
    "tqdm>=4.66",
    "mctx>=0.0.71",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.7"]
prior = [
    "rasterio>=1.3",
    "pyproj>=3.6",
    "requests>=2.31",
]
mission = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
